<style>

</style></head><body>
<div id="app" class="win">
 <div class="tb"><span>📖 BKBK.exe</span><span><button class="btn" id="cfg" style="padding:0 6px;font-size:11px;margin:0" title="Connect to sheet">⚙</button> <span id="status">loading…</span></span></div>
 <div id="tabs"></div><div id="msg"></div>
 <div id="grid">
  <div class="pane"><div class="ph" id="lt"></div><div class="body" id="L"></div></div>
  <div class="pane"><div class="ph" id="rt"></div><div class="body" id="R"></div></div>
 </div>
</div>
<script>
/* 웹앱 URL·키는 코드에 넣지 않고 ⚙ 버튼으로 입력 → 이 브라우저(localStorage)에만 저장 */
const LS=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};
const API=LS('bkbk_api'),KEY=LS('bkbk_key');

const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TABS=['Main','Book','Log','Text','Word','Shelf'];
let favPrev=null,lastTab='',view='L',D,tab='Main',sel=null,cal=new Date(),F={b:new Set(),t:new Set()},fav=null,cfg=false,shq='';
const P=v=>parseFloat(v)||0,PC=v=>Math.round(P(v)*10000)/100,dk=d=>String(d||'').slice(0,10);
const by=(a,f,r)=>[...a].sort((x,y)=>(f(x)>f(y)?1:f(x)<f(y)?-1:0)*(r?-1:1));
const has=v=>v!==''&&v!=null,bpg=o=>P((BM.get(String(o.book))||{}).page);
const epc=(o,pk,gk)=>has(o[pk])?PC(o[pk]):has(o[gk])&&bpg(o)?Math.min(100,P(o[gk])/bpg(o)*100):0;
const eOn=l=>epc(l,'onpct','onpage'),eOff=l=>epc(l,'offpct','offpage'),eAt=t=>epc(t,'pct','page');
let BM=new Map(),LM=new Map();
const bk=id=>BM.get(String(id))||{};
const logs=id=>LM.get(String(id))||[];
const prog=id=>Math.max(0,...logs(id).map(eOff));
const fin=id=>prog(id)>=100;
const finD=id=>logs(id).filter(l=>eOff(l)>=100).map(l=>dk(l.date)).sort().pop()||'';
const lastD=id=>logs(id).map(l=>dk(l.date)).sort().pop()||'';
const split=s=>String(s||'').split(/[,;]\s*/).filter(Boolean);
const lum=h=>{h=String(h||'#888').replace('#','');if(h.length<6)return'#fff';const[r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16));return r*.3+g*.59+b*.11>150?'#222':'#fff'};

/* ---------- 데이터 ---------- */
async function load(){
  if(!API){D=demo();$('#status').textContent='demo · click ⚙ to connect';$('#msg').innerHTML='<div class="err">DEMO MODE – nothing is saved. Tap ⚙ and enter your web app URL.</div>';return}
  const c=await idbGet('data:'+API);
  if(c&&c.Books){D=c;$('#status').textContent='syncing…';refresh(true);return}
  await refresh(false);
}
async function refresh(bg){
  const w0=wseq;
  try{const r=await fetch(API+(API.includes('?')?'&':'?')+'action=all&key='+encodeURIComponent(KEY));const j=await r.json();if(j.error)throw new Error(j.error);
    for(const k of['Books','Tags','Series','Logs','Texts','Words'])j[k]=j[k]||[];
    if(bg&&(wseq!==w0||wq.length||wbusy||ed||cfg||fm)){$('#status').textContent='connecting...';return}
    D=j;idbSet('data:'+API,j);$('#status').textContent='connecting...';if(bg)render()}
  catch(e){if(bg){$('#status').textContent='offline (cached)';return}D=demo();$('#status').textContent='offline (demo)';$('#msg').innerHTML='<div class="err">Could not load the sheet. Check the web app URL and its access setting (Anyone).</div>'}
}
function demo(){
  const d=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
  return{Books:[
   {id:1,name:'여름의 끝',author:'김서진',genre:'소설',series:1,volume:1,page:312,charcount:210000,star:8,comment:'조용하게 오래 남는 책.',color1:'#2f5d62',color2:'#e0b84f',color3:'#fff',height:21,thickness:2.4},
   {id:2,name:'느린 시간의 기술',author:'박하린',genre:'에세이',series:1,volume:2,page:240,charcount:150000,star:6,comment:'가볍게 읽기 좋음.',color1:'#b5402f',color2:'#f4eedc',color3:'#fff',height:19,thickness:1.8},
   {id:3,name:'종이 도시의 지도',author:'이도윤',genre:'인문',page:420,charcount:300000,star:10,comment:'',color1:'#24406b',color2:'#d8d2c2',color3:'#fff',height:23,thickness:3.2},
   {id:4,name:'작은 방의 철학',author:'김서진',genre:'에세이',page:180,charcount:90000,star:8,comment:'',color1:'#6b4a7a',color2:'#e0b84f',color3:'#fff',height:18,thickness:1.4}],
  Tags:[{id:1,name:'김서진',type:'author'},{id:2,name:'박하린',type:'author'},{id:3,name:'소설',type:'genre'},{id:4,name:'에세이',type:'genre'},{id:5,name:'Favorite',type:'theme'},{id:6,name:'시간',type:'theme'}],
  Series:[{id:1,name:'여름 연작'}],
  Logs:[{book:1,date:d(40),chapter:'1장',onpct:0.0,offpct:0.4},{book:1,date:d(35),chapter:'2장',onpct:0.4,offpct:1.0},{book:2,date:d(10),chapter:'1부',onpct:0.0,offpct:0.35},{book:2,date:d(2),chapter:'2부',onpct:0.35,offpct:0.62},{book:3,date:d(90),chapter:'전체',onpct:0.0,offpct:1.0},{book:4,date:d(1),chapter:'1장',onpct:0.0,offpct:0.13}],
  Texts:[{book:1,date:d(38),page:60,pct:0.19,text:'떠나는 것들은 늘 한 박자 늦게 돌아본다.',tags:'Favorite,시간'},{book:2,date:d(5),page:90,pct:0.38,text:'느리다는 건 멈췄다는 뜻이 아니라, 깊어진다는 뜻이다.',tags:'Favorite'},{book:3,date:d(80),page:200,pct:0.48,text:'지도는 길을 알려주지 않고 길을 잃을 자유를 준다.',tags:'시간'}],
  Words:[{book:1,date:d(37),page:50,pct:0.16,word:'무람없다',meaning:'예의를 지키지 않고 버릇없다'},{book:3,date:d(70),page:120,pct:0.28,word:'윤슬',meaning:'햇빛이나 달빛에 비쳐 반짝이는 물결'}]}
}

/* ---------- 공통 조각 ---------- */
const gid=u=>/^https?:/.test(u)?(String(u).match(/(?:\/d\/|[?&]id=)([\w-]+)/)||[])[1]:'';
function img(u,w=600){u=String(u||'');const id=gid(u);return/drive\.google|googleusercontent/.test(u)&&id?`https://lh3.googleusercontent.com/d/${id}=w${w}`:u}
/* 표지 로더: 화면을 다시 그려도 중단되지 않고, 동시에 4장씩만 요청, 실패하면 다른 주소로 재시도 */
const IC=new Map(),Q=[];let busy=0;
function want(u){if(IC.has(u))return;IC.set(u,0);Q.push(u);pump()}
function pump(){while(busy<4&&Q.length){busy++;tryLoad(Q.shift(),0)}}
function tryLoad(u,n){const id=gid(u),w=(u.match(/=w(\d+)$/)||[0,600])[1],src=[u,id?`https://drive.google.com/thumbnail?id=${id}&sz=w${w}`:u,u][n],im=new Image();im.referrerPolicy='no-referrer';
  im.onload=()=>{IC.set(u,src);busy--;hydrate();pump()};
  im.onerror=()=>{if(n<2)setTimeout(()=>tryLoad(u,n+1),n?1500:300);else{IC.set(u,'bad');busy--;hydrate();pump()}};
  im.src=src}
function hydrate(){document.querySelectorAll('img[data-u]:not([src])').forEach(i=>{const u=i.dataset.u,v=IC.get(u);if(v==='bad')i.remove();else if(v)i.src=v;else want(u)})}
const IM=(c,x='',w=600)=>{const u=img(c,w),v=IC.get(u);return`<img ${x} data-u="${E(u)}" ${v&&v!=='bad'?`src="${E(v)}"`:''} alt="">`};

function fscope(k){
  const src=k=='Text'?D.Texts:D.Words,ids=new Set(src.map(x=>String(x.book))),B=D.Books.filter(b=>ids.has(String(b.id)));
  const byN=(a,b)=>tn(a).localeCompare(tn(b),'ko'),ba=b=>nz(b.author,'author'),bg=b=>split(b.genre).map(x=>nz(x,'genre'));
  const ge=[...new Set(B.flatMap(bg))].sort(byN),sl=[...F.t],sg=sl.filter(n=>ge.includes(n));
  const Bg=B.filter(b=>!sg.length||bg(b).some(g=>sg.includes(g)));
  const au=[...new Set(Bg.map(ba).filter(Boolean))].sort(byN),sa=sl.filter(n=>au.includes(n));
  const th=k=='Text'?tagsOf('theme').map(t=>String(t.id)):[],st=sl.filter(n=>th.includes(n));
  const Bf=Bg.filter(b=>!sa.length||sa.includes(ba(b))).sort((a,b)=>String(a.name).localeCompare(String(b.name),'ko'));
  const sb=Bf.filter(b=>F.b.has(String(b.id)));
  return{au,ge,th,st,Bf,scope:new Set((sb.length?sb:Bf).map(b=>String(b.id)))};
}

function fsec(key,arr,fn){

function fit(){
  document.querySelectorAll('#L .hs').forEach(h=>{
    const f=FS[h.dataset.key],c=[...h.children];if(!f||!c.length||!h.clientWidth)return;
    const t0=c[0].offsetTop;let n=0;while(n<c.length&&c[n].offsetTop===t0)n++;
    for(let i=n;i<c.length;i++)c[i].style.display='none';
    f.n=n;const pc=h.previousElementSibling.querySelector('.pgc'),bt=pc.querySelectorAll('button');
    pc.hidden=!(f.s>0||f.s+n<f.t);pc.querySelector('i').textContent=`${f.s+1}–${f.s+n} / ${f.t}`;bt[0].disabled=!f.s;bt[1].disabled=f.s+n>=f.t;
  });

const wq=[];let wbusy=false,wseq=0,wfail=[],ct;
function cacheSoon(){clearTimeout(ct);ct=setTimeout(()=>{if(API&&D)idbSet('data:'+API,D)},400)}
function enqueue(j){wseq++;wq.push(j);pumpW()}
async function pumpW(){
  if(wbusy)return;wbusy=true;
  while(wq.length){const j=wq[0];$('#status').textContent='saving… ('+wq.length+')';let ok=false,err;
    for(let t=0;t<3&&!ok;t++){try{const r=await post(j);if(r&&r.ok===false)throw new Error(r.error);ok=true}catch(e){err=e;if(t<2)await new Promise(r=>setTimeout(r,700*(t+1)))}}
    wq.shift();if(!ok){wfail.push(j);$('#msg').innerHTML='<div class="err">Save failed ('+E(err.message)+'). The change is only on this screen. <button class="btn" data-retry>Retry</button></div>'}}
  wbusy=false;$('#status').textContent=wfail.length?'save failed':'saved ✓';if(!wfail.length)setTimeout(()=>{if(!wbusy&&!wfail.length)$('#status').textContent='connecting...'},1500);
}

function palette(im){
  const N=64,c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,N,N);x.drawImage(im,0,0,N,N);
  const d=x.getImageData(0,0,N,N).data,B={},tot=N*N;
  for(let i=0;i<d.length;i+=4){const k=(d[i]>>4)+','+(d[i+1]>>4)+','+(d[i+2]>>4),b=B[k]=B[k]||[0,0,0,0];b[0]++;b[1]+=d[i];b[2]+=d[i+1];b[3]+=d[i+2]}
  const L=Object.values(B).map(b=>({n:b[0],c:[b[1]/b[0],b[2]/b[0],b[3]/b[0]].map(Math.round)})).sort((a,b)=>b.n-a.n);
  const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]),sat=c=>{const m=Math.max(...c);return m?(m-Math.min(...c))/m:0},light=c=>Math.min(...c)>228;
  const w=o=>o.n*(light(o.c)?.25:1)*(.5+sat(o.c)),W=[...L].sort((a,b)=>w(b)-w(a));
  const p1=W[0].c,p2=(W.find(o=>dist(o.c,p1)>70&&o.n>=tot*.02)||W.find(o=>dist(o.c,p1)>70)||W[1]||W[0]).c;
  const a=L.filter(o=>o.n>=tot*.01&&dist(o.c,p1)>60&&dist(o.c,p2)>50).sort((a,b)=>sat(b.c)*Math.sqrt(b.n)-sat(a.c)*Math.sqrt(a.n))[0];
  const p3=a?a.c:(p1[0]*.3+p1[1]*.59+p1[2]*.11>140?[34,34,34]:[255,255,255]);
  return[p1,p2,p3].map(c=>'#'+c.map(v=>v.toString(16).padStart(2,'0')).join(''));
}
function upBusy(d){up=Math.max(0,up+d);const b=$('[data-bsave]');if(b){b.disabled=up>0;b.style.opacity=up?.5:1;b.firstElementChild.textContent=up?'Uploading…':'Save'}}
function onCover(f){

    const url=c.toDataURL('image/jpeg',.85),box=$('#cvup'),e=$('#bf').elements;
    box.style.backgroundImage=`url('${url}')`;box.textContent='';

  else if(g('data-roll')){favPrev=fav;fav=null}
  else if(x=g('data-pg'))pgAll+=+x.dataset.pg;
  else if(x=g('data-fp')){const[k,d]=x.dataset.fp.split(':'),f=FS[k];if(d>0){if(f.s+f.n<f.t){f.h.push(f.s);f.s+=f.n}}else f.s=f.h.pop()||0}
  else if(x=g('data-m'))cal=new Date(cal.getFullYear(),cal.getMonth()+ +x.dataset.m,1);
  else if(x=g('data-b')){if(ed)cancelEdit(true);fm=null;cfg=false;sel=x.dataset.b;view='R'}
  else return;
  render();
});
load().then(()=>{render();applySaved()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

</script></body></html>
